[project]
name = "customer-success-agent"
version = "0.1.0"
description = "Stage 1 Incubation - Customer Success AI Agent Prototype"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: Unit tests (no infrastructure required)",
    "integration: Integration tests (requires docker-compose stack)",
    "e2e: End-to-end pipeline tests (requires full stack)",
    "load: Load/performance tests (requires running API)",
]
