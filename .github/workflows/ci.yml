name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [master]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r production/requirements.txt

      - name: Run Stage 1 unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run Stage 2 unit tests
        run: |
          python -m pytest production/tests/test_agent.py \
            production/tests/test_channels.py \
            production/tests/test_transition.py -v --tb=short

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r production/requirements.txt

      - name: Start docker-compose stack
        run: |
          cd production
          docker-compose up -d
          cd ..

      - name: Wait for services
        run: python scripts/wait-for-healthy.py --timeout 120 --interval 5

      - name: Apply database schema
        run: |
          docker exec production-postgres-1 psql -U fte -d fte_crm -f /docker-entrypoint-initdb.d/schema.sql || true

      - name: Run database tests
        run: python -m pytest production/tests/test_database.py -v --tb=short

      - name: Run E2E tests
        run: python -m pytest production/tests/test_e2e.py -v --tb=short

      - name: Teardown
        if: always()
        run: |
          cd production
          docker-compose down -v

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          cd production
          docker build -t fte-crm-api:${{ github.sha }} .

      - name: Verify image
        run: docker images fte-crm-api
