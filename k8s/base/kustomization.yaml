# Base kustomization for CRM Digital FTE Factory
# References existing production manifests (excluding HPA and ingress)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../namespace.yaml
  - ../configmap.yaml
  - ../secrets.yaml
  - ../deployment-api.yaml
  - ../deployment-worker.yaml
  - ../service.yaml
  - ../postgres/deployment.yaml
  - ../postgres/service.yaml
  - ../kafka/deployment.yaml
  - ../kafka/service.yaml
