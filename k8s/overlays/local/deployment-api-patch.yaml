# Local API deployment patch
# - 1 replica instead of 3
# - Fix command path to match Dockerfile (production.api.main:app)
# - Relax probes for local development
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fte-api
  namespace: fte-production
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: api
          imagePullPolicy: IfNotPresent
          command:
            - "uvicorn"
            - "production.api.main:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8000"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
