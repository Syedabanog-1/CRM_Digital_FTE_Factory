# Grafana service exposed as NodePort for local access
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: fte-local
  labels:
    app: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30030
      protocol: TCP
