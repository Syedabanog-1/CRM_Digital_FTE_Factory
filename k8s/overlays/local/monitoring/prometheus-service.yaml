# Prometheus service exposed as NodePort for local access
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
  namespace: fte-local
  labels:
    app: prometheus
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
      protocol: TCP
