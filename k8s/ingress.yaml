apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fte-ingress
  namespace: fte-production
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - fte.techcorp.com
      secretName: fte-tls
  rules:
    - host: fte.techcorp.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fte-api-service
                port:
                  number: 80
